# Tell Spring Boot to always initialize the database with SQL scripts
spring.sql.init.mode=always

# If you use Hibernate/JPA entities, ensure they generate tables BEFORE data.sql runs
spring.jpa.defer-datasource-initialization=true

# Optional: Controls automatic table creation by Hibernate
# Set to 'update' or 'create-drop' depending on your environment needs
spring.jpa.hibernate.ddl-auto=update
